<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B-Farm | Simulation</title>
    <script>
        (function () {
            function hasCookie(name) {
                return document.cookie.split(';').some(function (cookie) {
                    return cookie.trim().split('=')[0] === name;
                });
            }

            function isLocalUrl() {
                return window.location.protocol === 'file:' ||
                    window.location.hostname === 'localhost' ||
                    window.location.hostname === '127.0.0.1' ||
                    window.location.hostname === '::1' ||
                    window.location.hostname === '[::1]';
            }

            if (!hasCookie('email') && isLocalUrl()) {
                document.cookie = 'email=local@hackcable.dev; path=/; SameSite=Lax';
            }
        })();
    </script>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />

    <!-- CSS will be auto-injected -->
    <!-- JS will be auto-injected -->
</head>

<body>
    <header>

    </header>
    <main>
        <div id="hackCable">

        </div>
    </main>
    <div class="controlBar">
        <div class="controlbar-resize-handle" aria-hidden="true"></div>

        <div id="status-message" class="status-message"></div>
        <div class="tab-panel code-panel active" style="display: flex; flex-direction: column; gap: 1rem;">
            <div class="buttonBar run-controls">
                <div class="run-controls-row">
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <button id="compile" class="run-circle-btn" data-i18n-title="ui.compile" title="Compile"
                            aria-label="Compile">
                            <span class="material-symbols-outlined run-btn-icon icon-default">check</span>
                            <span class="material-symbols-outlined run-btn-icon icon-cancel">close</span>
                        </button>
                        <button id="execute" class="run-circle-btn" data-i18n-title="ui.execute" title="Execute"
                            aria-label="Execute">
                            <svg class="run-btn-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M8 6.5v11l9-5.5z" fill="currentColor"></path>
                            </svg>
                        </button>
                        <button id="stop" class="run-circle-btn" data-i18n-title="ui.stop" title="Stop"
                            aria-label="Stop">
                            <span class="material-symbols-outlined run-btn-icon">stop</span>
                        </button>
                        <button id="pause" class="run-circle-btn" data-i18n-title="ui.pause" title="Pause"
                            aria-label="Pause">
                            <span class="material-symbols-outlined run-btn-icon">pause</span>
                        </button>
                    </div>
                    <!-- <button id="sim-http-toggle" class="sim-http-toggle-btn" type="button" aria-label="Simulated HTTP settings" aria-expanded="false">
                        <svg class="sim-http-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M12 18.4l-2.5-2.5a3.5 3.5 0 0 1 5 0L12 18.4zm-5.1-5.1-2-2a10.6 10.6 0 0 1 14.2 0l-2 2a7.6 7.6 0 0 0-10.2 0zm-4.1-4.1-2-2a16.6 16.6 0 0 1 22.4 0l-2 2a13.6 13.6 0 0 0-18.4 0z"></path>
                        </svg>
                    </button> -->
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <button id="upload-session" class="session-circle-btn" type="button" aria-label="Upload session"
                            title="Upload session">
                            <span class="material-symbols-outlined" aria-hidden="true">files</span>
                        </button>
                        <button id="download-session" class="session-circle-btn" type="button"
                            aria-label="Download session" title="Download session">
                            <span class="material-symbols-outlined" aria-hidden="true">save</span>
                        </button>
                    </div>
                    <input id="upload-session-input" type="file" accept=".json,application/json" hidden />
                </div>
                <div class="buttonBar sim-http-settings" id="sim-http-container" hidden>
                    <input id="sim-http-path" type="text" value="/status" />
                    <button id="sim-http-send">GET</button>
                    <pre id="sim-http-response" class="sim-http-response">Ready</pre>
                </div>
            </div>
            <div class="buttonBar wiring-controls" hidden>
                <p data-i18n="ui.wiring">Wiring:</p>
                <button id="save" data-i18n="ui.save">Save</button>
                <button id="restore" data-i18n="ui.load">Load</button>
                <button id="clear-all" data-i18n="ui.clearAll">Clear All</button>
            </div>
            <div class="controlbar-topright">
                <div class="controlbar-topright-row controlbar-topright-main">
                    <select id="board-select" class="controlbar-select-corner board-mode-corner">
                        <option value="arduino" disabled>Arduino Uno</option>
                        <option value="esp32" disabled>ESP32</option>
                        <option value="custom-esp32" disabled>Custom ESP32</option>
                        <option value="handysense" disabled>Handysense</option>
                        <option value="handysense-real" selected>Handysense real</option>
                        <option value="handysense-pro" disabled>Handysense pro</option>
                    </select>
                    <select id="compiler-mode" class="controlbar-select-corner compiler-mode-corner"
                        title="Compilation method" hidden aria-hidden="true" style="display:none">
                        <option value="clang-llvm" selected>Clang/LLVM WASM (first download ~35MB)</option>
                    </select>
                    <button id="language-toggle" class="language-toggle-btn language-toggle-corner"
                        aria-label="Toggle language" hidden aria-hidden="true">EN</button>
                </div>
                <div class="controlbar-topright-row controlbar-topright-examples">
                    <select id="code-examples" class="controlbar-select-corner examples-mode-corner">
                        <option value="" data-i18n="ui.selectExample">Select an example...</option>
                        <optgroup label="Handysensereal">
                            <option value="handysense_real_six_button_test" selected>6 Button Test</option>
                            <option value="handysense_real_eight_led_test">8 LED Test</option>
                            <option value="handysense_real_buttons_leds_test">Buttons + LEDs Test</option>
                            <option value="handysense_real_relay0_red_led_test">Relay0 LED Test</option>
                            <option value="handysense_real_bfarm_lux120k_relay0_red_led_test">Relay test</option>
                            <option value="handysense_real_bfarm_lux120k_buzzer_test">Buzzer test</option>
                            <option value="handysense_real_bfarm_ph_misting">BFARM RS485 pH + Misting Pump</option>
                            <option value="handysense_real_bfarm_soil_watering">BFARM Soil Moisture + Water Pump
                            </option>
                            <option value="handysense_real_bfarm_sht31_fan">BFARM SHT31 + Fan</option>
                        </optgroup>
                        <optgroup label="BFarm sensor TEST">
                            <option value="handysense_real_bfarm_7in1_soil_multiread_test">7in1Soil MultiRead Test
                            </option>
                            <option value="handysense_real_bfarm_ammonia_rs485_test">Ammonia Sensor (RS485) Test
                            </option>
                            <option value="handysense_real_bfarm_soil_temp_multiread_rs485_test">Soil Temp/Moisture
                                Sensor
                                (RS485) Test</option>
                            <option value="handysense_real_bfarm_sen55_air_i2c_test">SEN55 Air Sensor (I2C) Test
                            </option>
                            <option value="handysense_real_bfarm_ultrasonic_rs485_test">Ultrasonic Sensor (RS485) Test
                            </option>
                            <option value="handysense_real_bfarm_turbidity_xm3318b_rs485_test">Turbidity Sensor XM3318B
                                (RS485) Test</option>
                            <option value="handysense_real_bfarm_turbidity_xm8518_rs485_test">Turbidity Sensor XM8518
                                (RS485) Test</option>
                            <option value="handysense_real_bfarm_nitrate_isfet_rs485_test">Nitrate ISFET Sensor (RS485)
                                Test
                            </option>
                            <option value="handysense_real_bfarm_tmec_tensio_rs485_test">TMEC Tensio Sensor (RS485) Test
                            </option>
                            <option value="handysense_real_bfarm_tmec_analog_test">TMEC Analog Sensor Test</option>
                            <option value="handysense_real_bfarm_water_quality_suite_rs485_test">Water Quality Suite
                                (RS485)
                                Test</option>
                            <option value="handysense_real_bfarm_tubular_soil_probe_rs485_test">Tubular Soil Probe
                                (RS485)
                                Test</option>
                            <option value="handysense_real_bfarm_air_velocity_sensor_sm3789_test">Air Velocity Sensor
                                (SM3789) Test</option>
                            <option value="handysense_real_bfarm_lux120k_rs485_test">Lux120k rs485 Test</option>
                            <option value="handysense_real_bfarm_weather_sensor_test">Weather sensor Test</option>
                        </optgroup>
                        <optgroup label="Sensor Test">
                            <option value="handysense_real_sensor_weather_htco2plx_test">Weather HTCO2PLX (RS485) Test
                            </option>
                            <option value="handysense_real_sensor_sht31_rs485_test">SHT31 Sensor (RS485) Test</option>
                            <option value="handysense_real_sensor_sht31_i2c_test">SHT31 Sensor (I2C) Test</option>
                            <option value="handysense_real_sensor_dt_par485_test">DT-Par485 Sensor Test</option>
                            <option value="handysense_real_sensor_bh1750_i2c_test">BH1750 Sensor (I2C) Test</option>
                            <option value="handysense_real_sensor_ph_rs485_test">pH Sensor (RS485) Test</option>
                            <option value="handysense_real_sensor_rain_rs485_test">Rain Sensor (RS485) Test</option>
                            <option value="handysense_real_sensor_weight_3kg_rs485_test">Weight Sensor 3 kg (RS485) Test
                            </option>
                            <option value="handysense_real_sensor_wind_direction_rs485_test">Wind Direction Sensor
                                (RS485)
                                Test</option>
                            <option value="handysense_real_sensor_wind_speed_rs485_test">Wind Speed Sensor (RS485) Test
                            </option>
                        </optgroup>
                        <optgroup label="Blockly Test">
                            <option value="humidity">humidity</option>
                            <option value="temperature">temperature</option>
                            <option value="light">light</option>
                            <option value="ph">ph</option>
                            <option value="pressure">pressure</option>
                            <option value="rain">rain</option>
                            <option value="wind">wind</option>
                            <option value="weight">weight</option>
                            <option value="weather">weather</option>
                            <option value="netpie_thingspeak">NETPIE + ThingSpeak</option>
                            <option value="awd">AWD</option>
                        </optgroup>
                    </select>
                </div>
            </div>
            <div class="buttonBar" id="editor-code-mock-container">
                <div class="editor-tab-buttons">
                    <button type="button" class="editor-tab-btn active" data-editor-tab="code">Code</button>
                    <button type="button" class="editor-tab-btn" data-editor-tab="mock">Mock Sensors</button>
                </div>
                <div class="editor-tab-panel active" data-editor-panel="code">
                    <div class="code-editor-shell">
                        <div class="code-editor-actions">
                            <button id="build-circuit-from-code" type="button"
                                title="Build circuit from code">Auto</button>
                            <button id="clear-code" type="button" title="Clear code">Clear</button>
                        </div>
                        <textarea id="code-editor" rows="7" spellcheck="false" wrap="off"></textarea>
                        <div id="code-editor-resize-handle" class="code-editor-resize-handle" aria-hidden="true"></div>
                    </div>
                </div>
                <div class="editor-tab-panel" data-editor-panel="mock" hidden>
                    <div class="mock-source-toggle" role="group" aria-label="Mock source">
                        <button type="button" class="mock-source-btn active" data-mock-source="text"
                            data-i18n="ui.mock.source.text">Text</button>
                        <button type="button" class="mock-source-btn" data-mock-source="timeline"
                            data-i18n="ui.mock.source.timeline">Timeline</button>
                    </div>
                    <div class="mock-source-panel" data-mock-source-panel="text">
                        <div class="mock-text-toolbar">
                            <button id="mock-text-toggle" type="button" class="mock-text-toggle" aria-expanded="false">
                                Show Text
                            </button>
                        </div>
                        <div class="mock-text-layout">
                            <textarea id="sensor-mock-input" rows="18" hidden>humidity = 60
  temperature = 25
ph = 7.0
lux = 500
soil = 50
ec = 1200
nitrogen = 120
phosphorus = 60
potassium = 180
  ammonia = 2.5
  pm1 = 8
  pm25 = 12
  pm4 = 15
  pm10 = 20
  voc = 100
  nox = 10
  distance = 150
  turbidity = 250
  tmec_analog_uv = 2500
  water_level = 120
  water_temperature = 24.5
  dissolved_oxygen = 8.25
  do_temperature = 25.5
  ammonia_temperature = 26
  tubular_moisture_10 = 42
  tubular_temperature_10 = 26
  tubular_moisture_20 = 45
  tubular_temperature_20 = 25
  tubular_moisture_30 = 48
  tubular_temperature_30 = 24
  tubular_moisture_40 = 52
  tubular_temperature_40 = 23
  tubular_moisture_50 = 56
  tubular_temperature_50 = 22
  air_velocity = 12
  noise = 48</textarea>
                            <div id="mock-text-sliders" class="mock-text-sliders" aria-label="Sensor mock sliders"></div>
                        </div>
                    </div>
                    <div class="mock-source-panel" data-mock-source-panel="timeline" hidden>
                        <div class="mock-timeline-toolbar">
                            <label class="mock-duration-label" for="mock-timeline-duration">
                                <span data-i18n="ui.mock.timeline.duration">Duration (s)</span>
                                <input id="mock-timeline-duration" type="number" min="1" step="1" value="20" />
                            </label>
                            <span class="mock-loop-pill" data-i18n="ui.mock.timeline.loopAlways">Loop: On</span>
                        </div>
                        <div class="mock-editor-mode-toolbar">
                            <button id="mock-open-timeline-btn" type="button" class="mock-editor-mode-btn"
                                data-i18n="ui.mock.graph.openTimeline">Open Timeline Editor</button>
                            <button id="mock-back-graph-btn" type="button" class="mock-editor-mode-btn"
                                data-i18n="ui.mock.graph.backGraph" hidden>Back to Graph</button>
                        </div>
                        <div id="mock-graph-editor" class="mock-graph-editor">
                            <div class="mock-graph-controls">
                                <label class="mock-graph-control" for="mock-graph-sensor">
                                    <span data-i18n="ui.mock.graph.sensor">Sensor</span>
                                    <select id="mock-graph-sensor"></select>
                                </label>
                                <label class="mock-graph-control" for="mock-graph-y-min">
                                    <span data-i18n="ui.mock.graph.yMin">Y Min</span>
                                    <input id="mock-graph-y-min" type="number" step="0.1" />
                                </label>
                                <label class="mock-graph-control" for="mock-graph-y-max">
                                    <span data-i18n="ui.mock.graph.yMax">Y Max</span>
                                    <input id="mock-graph-y-max" type="number" step="0.1" />
                                </label>
                                <button id="mock-delete-point-btn" type="button" class="mock-delete-point-btn"
                                    data-i18n="ui.mock.graph.deletePoint">Delete Point</button>
                            </div>
                            <div class="mock-graph-canvas-wrap">
                                <canvas id="mock-graph-canvas" class="mock-graph-canvas"></canvas>
                            </div>
                            <div class="mock-graph-hint" data-i18n="ui.mock.graph.hint">Click to add point. Drag point
                                to edit. Values use step/hold behavior.</div>
                        </div>
                        <div id="mock-timeline-editor" class="mock-timeline-editor" hidden>
                            <div id="mock-timeline-tracks" class="mock-timeline-tracks"></div>
                        </div>
                        <div id="mock-timeline-error" class="mock-timeline-error" hidden></div>
                    </div>
                </div>
            </div>
            <div class="buttonBar" id="compiled-io-container">
                <div class="compiled-tab-toolbar">
                    <div class="compiled-tab-buttons">
                        <button type="button" class="compiled-tab-btn active"
                            data-output-tab="compiled">Compiled</button>
                        <button type="button" class="compiled-tab-btn" data-output-tab="serial"
                            data-i18n="ui.serial.title">Serial Monitor</button>
                        <button type="button" class="compiled-tab-btn" data-output-tab="plotter"
                            data-i18n="ui.serialPlotter.title">Serial Plotter</button>
                    </div>
                </div>
                <div class="compiled-window-actions">
                    <button type="button" id="output-float-open" class="compiled-window-icon-btn"
                        aria-label="Float window" title="Float window">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path
                                d="M3 3h11a3 3 0 0 1 3 3v6a1 1 0 1 1-2 0V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h6a1 1 0 1 1 0 2H4a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zm7.29 7.29a1 1 0 0 1 1.42 0L13 11.59V10a1 1 0 1 1 2 0v4a1 1 0 0 1-1 1h-4a1 1 0 1 1 0-2h1.59l-1.3-1.29a1 1 0 0 1 0-1.42zM15 14h5a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3h-5a3 3 0 0 1-3-3v-3a3 3 0 0 1 3-3zm0 2a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1h-5z">
                            </path>
                        </svg>
                    </button>
                    <button type="button" id="output-clear-btn" class="compiled-window-icon-btn"
                        aria-label="Clear output" title="Clear output" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path
                                d="M9 3h6a2 2 0 0 1 2 2v1h3a1 1 0 1 1 0 2h-1v11a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V8H4a1 1 0 1 1 0-2h3V5a2 2 0 0 1 2-2zm0 3h6V5H9v1zm-2 2v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V8H7zm3 2a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0v-6a1 1 0 0 1 1-1zm4 0a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0v-6a1 1 0 0 1 1-1z">
                            </path>
                        </svg>
                    </button>
                    <button type="button" id="output-float-close" class="compiled-window-btn" hidden>Close</button>
                    <button type="button" id="output-float-drag" class="compiled-window-drag" hidden
                        title="Drag window">::</button>
                </div>
                <div class="compiled-tab-panel active" data-output-panel="compiled">
                    <textarea id="code-compiled" rows="10" wrap="off"></textarea>
                </div>
                <div class="compiled-tab-panel" data-output-panel="serial" hidden>
                    <div id="serial-output" class="serial-output"></div>
                </div>
                <div class="compiled-tab-panel" data-output-panel="plotter" hidden>
                    <canvas id="serial-plotter-canvas" class="serial-plotter-canvas"></canvas>
                </div>
            </div>
            <div id="sync-controls" class="buttonBar" hidden>
                <p>Sync:</p>
                <button id="transfer-to-blocks">Transfer to Blocks</button>
                <label><input type="checkbox" id="auto-sync-blocks"> Auto-sync</label>
            </div>
        </div>
        <div class="tab-panel io-panel">
            <div class="io-section">
                <div class="io-section-header">
                    <h4 class="io-section-title" data-i18n="ui.io.inputs">Inputs</h4>
                </div>
                <div id="io-inputs-list" class="io-list"></div>
            </div>
            <div class="io-section">
                <div class="io-section-header">
                    <h4 class="io-section-title" data-i18n="ui.io.outputs">Outputs</h4>
                </div>
                <div id="io-outputs-list" class="io-list"></div>
            </div>
        </div>
    </div>
    <button class="toggle-controlbar" title="Hide/Show panel">
        <span class="toggle-icon">&#9654;</span>
    </button>
</body>

</html>
