<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HackCable</title>
    <link rel="icon" href="./assets/icon.png" />

    <!-- CSS will be auto-injected -->
    <!-- JS will be auto-injected -->
</head>
<body>
    <header>

    </header>
    <main>
        <div id="hackCable">

        </div>
    </main>
    <div class="controlBar">
        <div id="status-message" class="status-message"></div>
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="code" data-i18n="ui.tab.code">Code</button>
            <button class="tab-btn" data-tab="io" data-i18n="ui.tab.io">I/O</button>
        </div>
        <div class="tab-panel code-panel active">
            <div class="buttonBar">
                <p data-i18n="ui.code">Code:</p>
                <button id="compile" data-i18n="ui.compile">Compile</button>
                <select id="compiler-mode" title="Compilation method" style="display:none">
                    <option value="micropython" selected>MicroPython - Legacy</option>
                    <option value="emscripten">Emscripten C++ - Native</option>
                    <option value="clang-llvm">Clang/LLVM WASM (first use: ~35MB)</option>
                    <option value="clang-native">Native Clang WASM</option>
                </select>
                <button id="execute" data-i18n="ui.execute">Execute</button>
                <button id="stop" data-i18n="ui.stop">Stop</button>
                <button id="pause" data-i18n="ui.pause">Pause</button>
            </div>
            <div class="buttonBar">
                <p data-i18n="ui.wiring">Wiring:</p>
                <button id="save" data-i18n="ui.save">Save</button>
                <button id="restore" data-i18n="ui.load">Load</button>
                <button id="clear-all" data-i18n="ui.clearAll">Clear All</button>
            </div>
            <div class="buttonBar">
                <p data-i18n="ui.language">Language:</p>
                <button id="language-en">English</button>
                <button id="language-th">ไทย</button>
            </div>
            <div class="buttonBar">
                <p data-i18n="ui.board">Board:</p>
                <select id="board-select">
                    <option value="arduino">Arduino Uno</option>
                    <option value="esp32">ESP32</option>
                    <option value="custom-esp32">Custom ESP32</option>
                    <option value="handysense-pro" selected>Handysense pro</option>
                </select>
            </div>
            <div class="buttonBar">
                <p data-i18n="ui.examples">Examples:</p>
                <select id="code-examples">
                    <option value="" data-i18n="ui.selectExample">Select an example...</option>
                    <option value="blink">LED Blink</option>
                    <option value="button">Button Input</option>
                    <option value="fade">LED Fade</option>
                    <optgroup label="Handysense Pro - Smart Farm" data-i18n-label="examples.smartFarmGroup">
                        <option value="phMistingControl" data-i18n="examples.phMistingControl">pH Misting Control</option>
                        <option value="humidityFanControl" data-i18n="examples.humidityFanControl">Humidity Fan Control</option>
                        <option value="phFullControl" data-i18n="examples.phFullControl" selected>pH Full Control</option>
                        <option value="humidityClimateControl" data-i18n="examples.humidityClimateControl">Humidity Climate Control</option>
                        <option value="dualSensorMisting" data-i18n="examples.dualSensorMisting">Dual Sensor Misting</option>
                        <option value="dualSensorFan" data-i18n="examples.dualSensorFan">Dual Sensor Fan</option>
                        <option value="relaySequentialBlink" data-i18n="examples.relaySequentialBlink">Relay Sequential Blink</option>
                        <option value="mcpSmartControl" data-i18n="examples.mcpSmartControl">MCP23008 Smart Control</option>
                    </optgroup>
                    <optgroup label="BFarm - Field Sensors" data-i18n-label="examples.bfarmGroup">
                        <option value="bfarm_rs485_ph" data-i18n="examples.bfarmRs485Ph">RS485 pH Sensor</option>
                        <option value="bfarm_rs485_light" data-i18n="examples.bfarmRs485Light">RS485 Light Sensor</option>
                        <option value="bfarm_rs485_rain" data-i18n="examples.bfarmRs485Rain">RS485 Rain Sensor</option>
                        <option value="bfarm_rs485_wind" data-i18n="examples.bfarmRs485Wind">RS485 Wind Speed</option>
                        <option value="bfarm_rs485_par" data-i18n="examples.bfarmRs485Par">RS485 PAR Sensor</option>
                        <option value="bfarm_rs485_weather" data-i18n="examples.bfarmRs485Weather">Weather HTCo2PLx</option>
                        <option value="bfarm_sht31" data-i18n="examples.bfarmSht31">SHT31 Temp+Humidity</option>
                        <option value="bfarm_bh1750" data-i18n="examples.bfarmBh1750">BH1750 Light (I2C)</option>
                        <option value="bfarm_current420ma" data-i18n="examples.bfarmCurrent420ma">4-20mA Current Loop</option>
                        <option value="bfarm_soil_moisture" data-i18n="examples.bfarmSoilMoisture">Soil Moisture</option>
                        <option value="bfarm_relay" data-i18n="examples.bfarmRelay">4-Channel Relay</option>
                        <option value="bfarm_fertilizer_ph" data-i18n="examples.bfarmFertilizerPh">Fertilizer pH Sensor</option>
                        <option value="bfarm_ec" data-i18n="examples.bfarmEc">EC Sensor</option>
                        <option value="bfarm_fertilizer_temp" data-i18n="examples.bfarmFertilizerTemp">Fertilizer Temp Sensor</option>
                        <option value="bfarm_button" data-i18n="examples.bfarmButton">4-Channel Button</option>
                    </optgroup>
                    <optgroup label="TEST BFARM">
                        <option value="test_bfarm_greenhouse">Greenhouse: SHT31 + WiFi + Cronjob + Fan</option>
                        <option value="test_bfarm_ph_mist_auto">pH Auto-Mist: RS485 pH + Cronjob + Pump</option>
                        <option value="test_bfarm_soil_irrigation">Soil Irrigation: Moisture + Daily Cronjob + Pump</option>
                        <option value="test_bfarm_light_neopixel">Light Monitor: BH1750 + NeoPixel</option>
                        <option value="test_bfarm_weather_wifi">Weather Station: RS485 Multi-Sensor + WiFi</option>
                    </optgroup>
                    <optgroup label="new Bfarm Test">
                        <option value="new_bfarm_smart_greenhouse">Smart Greenhouse End-to-End</option>
                        <option value="new_bfarm_awd_automation">Paddy Field AWD Automation</option>
                        <option value="new_bfarm_fertigation_lab">Fertigation Controller Lab</option>
                        <option value="new_bfarm_weather_station_sim">Edge Weather Station Simulator</option>
                        <option value="new_bfarm_hybrid_connectivity">Hybrid Connectivity Testbed</option>
                    </optgroup>
                </select>
            </div>
            <div class="buttonBar" id="sensor-mock-container">
                <p>Mock Sensors:</p>
                <textarea id="sensor-mock-input" rows="5" style="width:100%;font-family:monospace;font-size:12px;resize:vertical">humidity = 60
temperature = 25
ph = 7.0
lux = 500
soil = 50</textarea>
            </div>
            <div class="buttonBar" id="sim-http-container">
                <p>Simulated HTTP:</p>
                <input id="sim-http-path" type="text" value="/status" />
                <button id="sim-http-send">GET</button>
                <pre id="sim-http-response" class="sim-http-response">Ready</pre>
            </div>
            <div class="buttonBar">
                <p>Sync:</p>
                <button id="transfer-to-blocks">Transfer to Blocks</button>
                <label><input type="checkbox" id="auto-sync-blocks"> Auto-sync</label>
            </div>
            <label for="code-editor" data-i18n="ui.codeLabel">Code:</label>
            <textarea id="code-editor" rows="10"></textarea>
            <label for="code-compiled" data-i18n="ui.compiledCode">Compiled Code:</label>
            <textarea id="code-compiled" rows="10" wrap="off"></textarea>
        </div>
        <div class="tab-panel io-panel">
            <div class="io-section">
                <h4 class="io-section-title" data-i18n="ui.io.outputs">Outputs</h4>
                <div id="io-outputs-list" class="io-list"></div>
            </div>
            <div class="io-section">
                <h4 class="io-section-title" data-i18n="ui.io.inputs">Inputs</h4>
                <div id="io-inputs-list" class="io-list"></div>
            </div>
            <div class="io-section serial-in-io">
                <div class="serial-monitor-header">
                    <span class="serial-monitor-title" data-i18n="ui.serial.title">Serial Monitor</span>
                    <button id="serial-clear" data-i18n="ui.serial.clear">Clear</button>
                </div>
                <div id="serial-output" class="serial-output"></div>
            </div>
            <div class="io-section serial-plotter-section">
                <div class="serial-plotter-header">
                    <span class="serial-plotter-title" data-i18n="ui.serialPlotter.title">Serial Plotter</span>
                    <button id="serial-plotter-clear" data-i18n="ui.serial.clear">Clear</button>
                </div>
                <canvas id="serial-plotter-canvas" class="serial-plotter-canvas"></canvas>
            </div>
        </div>
    </div>
    <button class="toggle-controlbar" title="Hide/Show panel">
        <span class="toggle-icon">▶</span>
    </button>
    <footer>
        <div>

        </div>
    </footer>
</body>
</html>
