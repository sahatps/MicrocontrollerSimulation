<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HackCable + bfarm</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-family: sans-serif; }

    #nav {
      display: flex;
      align-items: center;
      height: 40px;
      background: linear-gradient(to right, #f4f4f4, #77af5a);
      padding: 0 16px;
      gap: 8px;
      flex-shrink: 0;
      z-index: 10;
      border-bottom: 1px solid #5f9447;
    }
    #nav .title {
      display: flex;
      align-items: center;
      margin-right: 8px;
      text-decoration: none;
    }
    #nav .title img {
      display: block;
      height: 28px;
      width: auto;
    }
    #nav .sep {
      width: 1px;
      height: 20px;
      background: rgba(49, 80, 33, 0.22);
      margin: 0 4px;
    }
    #nav button {
      padding: 4px 18px;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.82);
      color: #315021;
      transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    #nav button.active {
      background: #77af5a;
      color: #fff;
      border-color: #5f9447;
      box-shadow: 0 1px 3px rgba(49, 80, 33, 0.18);
    }
    #nav button:hover:not(.active) {
      background: #ffffff;
      color: #315021;
      border-color: rgba(95, 148, 71, 0.4);
    }
    #nav .nav-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #nav .nav-actions.hidden {
      display: none;
    }
    #nav .canvas-view-toggle-shell,
    #nav .controlbar-toggle-shell {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(95, 148, 71, 0.45);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4e6b3d;
      transition: transform 0.2s ease, border-color 0.2s ease, filter 0.2s ease, background 0.2s ease, color 0.2s ease;
    }
    #nav .canvas-view-toggle-shell:hover,
    #nav .controlbar-toggle-shell:hover {
      transform: scale(1.04);
      border-color: rgba(95, 148, 71, 0.8);
      filter: brightness(1.02);
      background: #ffffff;
      color: #315021;
    }
    #nav .canvas-view-toggle-shell.is-active {
      background: linear-gradient(135deg, #8ac46b 0%, #5f9447 100%);
      border-color: rgba(95, 148, 71, 0.95);
      color: #ffffff;
    }
    #nav .controlbar-toggle-shell.is-hidden {
      border-color: rgba(134, 152, 119, 0.55);
      background: rgba(244, 244, 244, 0.72);
      color: #7f8d74;
    }
    #nav .canvas-view-toggle-shell svg,
    #nav .controlbar-toggle-shell svg {
      width: 20px;
      height: 20px;
      display: block;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    #frames { flex: 1; overflow: hidden; position: relative; }
    .pane {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .pane iframe { width: 100%; height: 100%; border: none; display: block; }
    .pane.hidden { display: none; }
  </style>
</head>
<body>
  <nav id="nav">
    <span class="title">
      <img src="./hackcable/assets/farmblock-logo.png" alt="B-Farm" />
    </span>
    <div class="sep"></div>
    <button id="btn-circuit" onclick="switchCanvas('circuit')">⬡ Circuit</button>
    <button id="btn-blocks"  onclick="switchCanvas('blocks')">⬢ Blocks</button>
    <div id="nav-actions" class="nav-actions">
      <button id="btn-darkmode" class="canvas-view-toggle-shell" type="button" title="Switch to dark canvas" aria-label="Switch to dark canvas" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.5 14.2A8.7 8.7 0 0 1 9.8 3.5a.8.8 0 0 0-.9-1A10.1 10.1 0 1 0 21.5 15a.8.8 0 0 0-1-.8z"></path>
        </svg>
      </button>
      <button id="btn-grid" class="canvas-view-toggle-shell" type="button" title="Hide grid" aria-label="Hide grid" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"></path>
        </svg>
      </button>
      <button id="btn-controlbar" class="controlbar-toggle-shell" type="button" title="Hide control panel" aria-label="Hide control panel" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="8" fill="none"></circle>
          <path d="M9.5 8.5L6.5 12L9.5 15.5" fill="none"></path>
          <path d="M14.5 8.5L17.5 12L14.5 15.5" fill="none"></path>
          <path d="M10.5 8L13.5 16" fill="none"></path>
        </svg>
      </button>
    </div>
  </nav>

  <div id="frames">
    <div id="pane-hackcable" class="pane">
      <iframe id="frame-hackcable" src="./hackcable/index.html" allow="cross-origin-isolated"></iframe>
    </div>
    <div id="pane-bfarm" class="pane hidden">
      <iframe id="frame-bfarm" src="./blocks/index.html"></iframe>
    </div>
  </div>

  <script>
    // Guard against accidental recursive embedding.
    // If /blocks/index.html (or another route) resolves to this shell page,
    // loading it inside an iframe can create infinite shell-in-shell nesting.
    if (window.top !== window.self) {
      document.body.innerHTML = [
        '<div style="padding:16px;font-family:sans-serif;color:#fff;background:#30343F;">',
        '<strong>Blocks view is unavailable.</strong><br/>',
        'The shell page was loaded inside an iframe, which indicates a deploy/path issue for <code>/blocks/index.html</code>.',
        '</div>'
      ].join('');
      throw new Error('HackCable shell loaded inside iframe');
    }

    var hcPane  = document.getElementById('pane-hackcable');
    var bfPane  = document.getElementById('pane-bfarm');
    var btnCircuit = document.getElementById('btn-circuit');
    var btnBlocks  = document.getElementById('btn-blocks');
    var navActions = document.getElementById('nav-actions');
    var btnDarkMode = document.getElementById('btn-darkmode');
    var btnGrid = document.getElementById('btn-grid');
    var btnControlBar = document.getElementById('btn-controlbar');
    var frameHackCable = document.getElementById('frame-hackcable');

    function sendToHackCable(message) {
      if (frameHackCable && frameHackCable.contentWindow) {
        frameHackCable.contentWindow.postMessage(message, '*');
      }
    }

    function setControlBarBtnState(hidden) {
      if (!btnControlBar) return;
      var isHidden = !!hidden;
      btnControlBar.classList.toggle('is-hidden', isHidden);
      btnControlBar.title = isHidden ? 'Show control panel' : 'Hide control panel';
      btnControlBar.setAttribute('aria-label', isHidden ? 'Show control panel' : 'Hide control panel');
      btnControlBar.setAttribute('aria-pressed', isHidden ? 'true' : 'false');
    }

    function setCanvasViewBtnState(button, isActive, activeTitle, inactiveTitle) {
      if (!button) return;
      button.classList.toggle('is-active', !!isActive);
      button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      button.title = isActive ? activeTitle : inactiveTitle;
      button.setAttribute('aria-label', isActive ? activeTitle : inactiveTitle);
    }

    function setCanvasViewState(darkMode, gridVisible) {
      setCanvasViewBtnState(btnDarkMode, !!darkMode, 'Switch to light canvas', 'Switch to dark canvas');
      setCanvasViewBtnState(btnGrid, !!gridVisible, 'Hide grid', 'Show grid');
    }

    if (btnControlBar) {
      btnControlBar.addEventListener('click', function() {
        sendToHackCable({ source: 'shell', type: 'toggle-controlbar' });
      });
    }
    if (btnDarkMode) {
      btnDarkMode.addEventListener('click', function() {
        sendToHackCable({ source: 'shell', type: 'toggle-canvas-dark-mode' });
      });
    }
    if (btnGrid) {
      btnGrid.addEventListener('click', function() {
        sendToHackCable({ source: 'shell', type: 'toggle-canvas-grid-visible' });
      });
    }

    function switchCanvas(which) {
      if (which === 'circuit') {
        hcPane.classList.remove('hidden');
        bfPane.classList.add('hidden');
        btnCircuit.classList.add('active');
        btnBlocks.classList.remove('active');
        if (navActions) navActions.classList.remove('hidden');
      } else {
        hcPane.classList.add('hidden');
        bfPane.classList.remove('hidden');
        btnBlocks.classList.add('active');
        btnCircuit.classList.remove('active');
        if (navActions) navActions.classList.add('hidden');
      }
      localStorage.setItem('activeCanvas', which);
      location.hash = which;
      notifyResize();
      if (which === 'circuit') {
        sendToHackCable({ source: 'shell', type: 'get-controlbar-state' });
        sendToHackCable({ source: 'shell', type: 'get-canvas-view-state' });
      }
    }

    function notifyResize() {
      var msg = { source: 'shell', type: 'resize' };
      var hcFrame = document.getElementById('frame-hackcable');
      var bfFrame = document.getElementById('frame-bfarm');
      if (hcFrame.contentWindow) hcFrame.contentWindow.postMessage(msg, '*');
      if (bfFrame.contentWindow) bfFrame.contentWindow.postMessage(msg, '*');
    }

    // Relay bfarm messages → HackCable
    window.addEventListener('message', function(e) {
      if (!e.data || e.data.source !== 'bfarm') return;
      if (e.data.type !== 'code-sync' && e.data.type !== 'add-component') return;

      // Adding a component: switch to circuit so the canvas is visible
      if (e.data.type === 'add-component') {
        switchCanvas('circuit');
      }

      var hcFrame = document.getElementById('frame-hackcable');
      if (hcFrame.contentWindow) hcFrame.contentWindow.postMessage(e.data, '*');
    });

    // Relay HackCable messages → bfarm
    window.addEventListener('message', function(e) {
      if (!e.data || e.data.source !== 'hackcable') return;
      if (e.data.type === 'code-sync') {
        var bfFrame = document.getElementById('frame-bfarm');
        if (bfFrame.contentWindow) bfFrame.contentWindow.postMessage(e.data, '*');
        return;
      }
      if (e.data.type === 'controlbar-state') {
        setControlBarBtnState(!!e.data.hidden);
        return;
      }
      if (e.data.type === 'canvas-view-state') {
        setCanvasViewState(!!e.data.darkMode, !!e.data.gridVisible);
      }
    });

    // Initial view — support legacy hashes (hackcable, bfarm, combine) and new ones
    var hash = location.hash.slice(1) || localStorage.getItem('activeCanvas') || 'circuit';
    var initial = (hash === 'blocks' || hash === 'bfarm') ? 'blocks' : 'circuit';
    switchCanvas(initial);
    if (frameHackCable) {
      frameHackCable.addEventListener('load', function() {
        sendToHackCable({ source: 'shell', type: 'get-controlbar-state' });
        sendToHackCable({ source: 'shell', type: 'get-canvas-view-state' });
      });
    }
  </script>
</body>
</html>
