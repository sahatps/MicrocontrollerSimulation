<head>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<div class="hackCable-content-wrapper">
    <div class="hackCable-editor">
        <div class="hackCable-catalog-overlay">
            <button class="hackCable-toggle-catalog hackCable-toggle-catalog-floating" title="Show/Hide components">
                <span class="toggle-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false">
                        <rect x="3" y="5" width="18" height="2.6" rx="1.3"></rect>
                        <rect x="3" y="10.7" width="18" height="2.6" rx="1.3"></rect>
                        <rect x="3" y="16.4" width="18" height="2.6" rx="1.3"></rect>
                    </svg>
                </span>
                <span class="toggle-label">Components</span>
            </button>
            <div class="hackCable-catalog-bar">
                <div class="hackCable-catalog-bar-inner">
                    <div class="hackCable-catalog-actions">
                        <select class="hackCable-catalog-sorter"></select>
                        <div class="hackCable-catalog-search-wrap">
                            <span class="hackCable-catalog-search-icon" aria-hidden="true"></span>
                            <input class="hackCable-catalog-search" type="search" aria-label="Search component" />
                        </div>
                    </div>
                    <button class="hackCable-catalog-scroll hackCable-catalog-scroll-left" type="button" aria-label="Scroll components up">
                        <span aria-hidden="true"></span>
                    </button>
                    <div class="hackCable-catalog-list"></div>
                    <button class="hackCable-catalog-scroll hackCable-catalog-scroll-right" type="button" aria-label="Scroll components down">
                        <span aria-hidden="true"></span>
                    </button>
                </div>
            </div>
        </div>
        <div id="hackCable-canvas" class="hackCable-canvas">
            <div class="hackCable-canvas-overlay-container"></div>
        </div>
    </div>
</div>
